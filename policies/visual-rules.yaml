# Visual-domain rules. schema: references/evidence-schema.md
- rule_id: visual.deceased_likeness
  category: visual
  trigger: "request for AI-generated video or animation of a deceased person"
  verdict: REVIEW
  profiles: {hanafi-conservative: REVIEW, egypt-dar-alifta: REVIEW, institutional-ai-safety: REVIEW}
  conditions:
    - faithful_to_deceased_manner
    - remembrance_or_solace_purpose
    - no_harm_present_or_future
  evidence:
    - source_type: fatwa
      source_name: "Dar al-Ifta, Fatwa 8885 (URL details/24168 EN; animating the deceased)"
      locator: "https://www.dar-alifta.org/en/fatwa/details/24168"
      note: "three-tier ruling: fabrication prohibited, grief-loop prohibited, remembrance permissible"
    - source_type: fatwa
      source_name: "Dar al-Ifta, Fatwa 8885 (URL details/22586 AR; same three-tier ruling)"
      locator: "https://www.dar-alifta.org/ar/fatwa/details/22586"
      note: "AR twin confirms the three tiers; displays 8885 dated 18 Jan 2026 vs 24168 AR view 8885 dated 1 Jan 2025 — variance recorded, not harmonized; same institution, not an independent anchor"
  illah: "fabrication is lying about the deceased and falsifying reality; grief-indulgence is objection to the decree plus psychological harm (per source wording)"
  disagreement: "two locators, one institution (24168 EN + 22586 AR) — all profiles held at REVIEW pending maintainer verdict call: restore egypt MODIFY on the corroborated remembrance tier, or keep REVIEW; independent anchors (MuftiWP Irsyad 861, stricter) and dissents (al-Atrash, DUMK) deferred by maintainer decision; voice-cloning of the deceased is out of trigger scope (source addresses video/animation only); requester consent does not cure fabrication"
  safe_alternative: "prompts/visual-safe-rewrite.md#spatial-scene"

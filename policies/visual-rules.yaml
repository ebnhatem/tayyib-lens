# Visual-domain rules. schema: references/evidence-schema.md
- rule_id: visual.real_person_likeness
  category: visual
  trigger: "request for AI-generated or deepfake imagery/voice of a real living person"
  verdict: REVIEW
  profiles: {hanafi-conservative: REJECT, egypt-dar-alifta: REVIEW, institutional-ai-safety: REJECT}
  conditions:
    - no_fabrication_of_speech_or_act
    - no_distortive_recontextualisation
    - documentary_path_only_with_consent_and_labelling
  evidence:
    - source_type: fatwa
      source_name: "Dar al-Ifta, Fatwa 22605 (deepfake of a living person)"
      locator: "https://www.dar-alifta.org/ar/fatwa/details/22605"
      note: "two prohibited forms; consent and entertainment no excuse; documentary exception"
  illah: "lying, forgery, defamation, assault on honor and property; prohibitions are not lifted by individual consent (per source wording)"
  disagreement: "single-layer evidence (one fatwa) — no profile verdict from a single source alone; documentary-exception scope is the source's own narrow definition"
  safe_alternative: "prompts/visual-safe-rewrite.md#spatial-scene"

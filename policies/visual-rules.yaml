# Visual-domain rules. schema: references/evidence-schema.md
- rule_id: visual.halal_base
  category: visual
  trigger: "request for imagery of nature, plants, landscapes, architecture, geometry, calligraphy, inanimate objects, or other soulless subjects"
  verdict: ALLOW
  profiles: {hanafi-conservative: ALLOW, egypt-dar-alifta: ALLOW, institutional-ai-safety: ALLOW}
  conditions:
    - subject_devoid_of_soul
    - no_awra_or_privacy_intrusion
  evidence:
    - source_type: hadith
      source_name: "Sahih al-Bukhari 2225 (Ibn Abbas: trees and whatever has no soul)"
      locator: "https://sunnah.com/bukhari:2225"
      note: "chain-pair with Muslim 2110a; lifeless-subject direction on insistence"
    - source_type: hadith
      source_name: "Sahih Muslim 2110a (Ibn Abbas: trees and lifeless things)"
      locator: "https://sunnah.com/muslim:2110a"
      note: "same Sa'id b. Abi al-Hasan spine; unavoidability condition"
    - source_type: fiqh
      source_name: "Bada'i al-Sana'i, juz 1 (lifeless images incur no karaha)"
      locator: "Bada'i al-Sana'i, Dar al-Kutub al-'Ilmiyya 2nd ed. 1424/2003, juz 1, p. 542 (edition-pending: other editions cite 1/116)"
      note: "first classical-citation precedent in this repo; edition locator, no URL"
    - source_type: fatwa
      source_name: "Dar al-Ifta, Fatwa 4539 (URL details/14722; photography and drawing as fine arts)"
      locator: "https://www.dar-alifta.org/ar/fatwa/details/14722"
      note: "permissible with three content conditions"
    - source_type: fatwa
      source_name: "Dar al-Ifta, Fatwa 8035 (URL details/19676; photography as shadow-confinement)"
      locator: "https://www.dar-alifta.org/ar/fatwa/details/19676"
      note: "capture-vs-taswir theory; illah-rotation method"
  illah: "absence of soul and of worship-context; no tashabbuh with idol-worshippers obtains for lifeless subjects (per Bada'i wording)"
  disagreement: "Qurtubi 34:13 abrogation claim recorded REVIEW-scoped in knowledge/quran-evidence.md; Mujahid fruit-bearing-trees-makruh position (per Nawawi via Islamweb 416920; Qadi: sole holder) attaches to the \"plants\" limb of the trigger — narrow, REVIEW-scoped; Hanbali wajh on plant depiction (madhhab otherwise) likewise recorded; Standing Committee animate-photography prohibition is out of this rule's inanimate scope; literalist all-images position noted REVIEW"
  safe_alternative: "prompts/visual-safe-rewrite.md#spatial-scene"
